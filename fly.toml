# Fly.io: one always-on machine in Toronto with a 1 GB volume for the log and the
# briefs staff edit. Secrets (GEMINI_API_KEY, STAFF_TOKEN) are set with `fly secrets`.
app = "municipal-agents"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  LEAD_MODEL = "gemini-3.6-flash"
  SPECIALIST_MODEL = "gemini-3.6-flash"
  DAILY_LIMIT_USD = "5"

[[mounts]]
  source = "municipal_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
