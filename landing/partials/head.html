<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta property="og:site_name" content="Municipal Agents" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
<link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<script>
  (function () {
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem("ma-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    d.dataset.theme = t;
    d.classList.add("js");
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("motion");
  })();
</script>
<script type="module" src="/src/main.ts"></script>
